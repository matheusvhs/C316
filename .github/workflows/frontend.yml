name: Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [projeto-final]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualidade:
    name: Biome, Vitest e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências pelo lockfile
        run: npm ci

      - name: Biome (lint, formatação e imports)
        run: npm run ci

      - name: Vitest
        run: npm test

      - name: Build de produção
        run: npm run build
