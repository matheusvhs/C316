name: Frontend CI

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml", "Makefile"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml", "Makefile"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências pelo lockfile
        run: npm ci
      - name: Biome (lint, formatação e imports)
        run: npm run check
      - name: Vitest (unitários + integração)
        run: npm run test
      - name: Build de produção
        run: npm run build

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: qualidade
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Rodar os testes E2E
        run: npm run test:e2e
      - name: Guardar o relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: frontend/playwright-report/
          retention-days: 7
